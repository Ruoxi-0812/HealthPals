name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Maven package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Package JAR
        working-directory: backend
        run: mvn -B -q package -DskipTests

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder-password
          GOOGLE_OAUTH_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
        run: docker compose config

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: healthpals-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: healthpals-frontend:ci
          build-args: |
            VUE_APP_API_BASE_URL=/api/personal-heath/v1.0
            VUE_APP_GOOGLE_CLIENT_ID=ci-placeholder.apps.googleusercontent.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
