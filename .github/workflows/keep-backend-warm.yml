name: Keep backend warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify backend and database readiness
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 75 https://healthpals-api.onrender.com/api/personal-heath/v1.0/health/ready --output readiness.json
          python3 -c 'import json; data=json.load(open("readiness.json")); assert data.get("status") == "ready", "Backend/database not ready"'
